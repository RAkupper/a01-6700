# Build backend
[build-system]
requires = ["hatchling"]          
build-backend = "hatchling.build"

[project]
name = "assignment-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

# Hatchling: where to find the package sources
[tool.hatch.build.targets.wheel]
packages = ["src/assignment_1"]

# Test runner
[tool.pytest.ini_options]
testpaths = ["tests"]


